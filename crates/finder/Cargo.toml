[package]
name = "finder"
description = "Finder UI: keyword prompt, result list, opens the file manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Replays scripted clicks for UI checks (see src/uitest.rs). Not for release builds.
uitest = []

[dependencies]
finder-core = { path = "../core" }
fltk = { version = "1.5.23", features = ["use-wayland", "no-images"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
