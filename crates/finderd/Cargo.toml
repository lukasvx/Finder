[package]
name = "finderd"
description = "Finder background daemon: file index, change listener, search"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
finder-core = { path = "../core" }
bytemuck = { version = "1.25.2", features = ["derive"] }
memchr = "2.8.3"
memmap2 = "0.9.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO"] }
